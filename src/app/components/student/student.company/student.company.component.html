
<!-- Companies Section -->
<div class="section-header animate-fade-in">
  <i class="bi bi-building-fill"></i> DANH SÁCH CÔNG TY THỰC TẬP
</div>
<div class="content-card animate-fade-in">
  <!-- Search Box -->
  <div class="search-container">
      <div class="search-box">
          <i class="bi bi-search search-icon"></i>
          <input type="text" class="search-input" id="companySearchInput" placeholder="Tìm kiếm sinh viên theo tên..."
          [(ngModel)]="searchTerm" (input)="search()" >
      </div>
  </div>
  
  <!-- Company Grid -->
  <div class="company-grid" id="companyGrid" >
      <!-- Company 1 -->
      <div *ngFor="let company of companyList" class="company-card">
          <div class="company-header">
              <div class="company-logo">
                  <i class="bi bi-code-slash"></i>
              </div>
              <div>
                  <h3 class="company-name">{{company.company_name}}</h3>
                  <div class="company-industry">
                      <i class="bi bi-briefcase"></i> {{company.contact_person}}
                  </div>
              </div>
          </div>
          <div class="company-body">
              <div class="company-info">
                  <i class="bi bi-geo-alt company-info-icon"></i>
                  <div class="company-info-text">{{company.address}}</div>
              </div>
              <div class="company-info">
                  <i class="bi bi-telephone company-info-icon"></i>
                  <div class="company-info-text">{{company.phone_number}}</div>
              </div>
              <div class="company-info">
                  <i class="bi bi-envelope company-info-icon"></i>
                  <div class="company-info-text">{{company.email}}</div>
              </div>
          </div>
      </div>
  </div>
  
  <!-- Pagination -->
  <div class="table-footer">
      <div class="pagination-info">
          Hiển thị 1-6 của 18 công ty
      </div>
      <div class="pagination-container">
          <nav aria-label="Page navigation">
              <ul class="pagination pagination-sm mb-0">
                  <li class="page-item disabled">
                      <a class="page-link" href="#" aria-label="Previous">
                          <span aria-hidden="true"><i class="bi bi-chevron-left"></i></span>
                      </a>
                  </li>
                  <li class="page-item active"><a class="page-link" href="#">1</a></li>
                  <li class="page-item"><a class="page-link" href="#">2</a></li>
                  <li class="page-item"><a class="page-link" href="#">3</a></li>
                  <li class="page-item">
                      <a class="page-link" href="#" aria-label="Next">
                          <span aria-hidden="true"><i class="bi bi-chevron-right"></i></span>
                      </a>
                  </li>
              </ul>
          </nav>
          <button class="btn btn-view-all btn-primary ms-2">
              Xem tất cả <i class="bi bi-arrow-right ms-1"></i>
          </button>
      </div>
  </div>
</div>
