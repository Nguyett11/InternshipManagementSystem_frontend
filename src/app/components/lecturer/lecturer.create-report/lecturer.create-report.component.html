<!-- Create Report Form -->
  <div class="row">
      <div class="col-lg-8 mb-4">
          <div class="card">
              <div class="card-header">
                  <i class="bi bi-file-earmark-text me-2"></i> Thông tin báo cáo
              </div>
              <div class="card-body">
                  <form id="reportForm">
                      <div class="mb-3">
                          <label for="reportTitle" class="form-label">Tiêu đề báo cáo <span class="text-danger">*</span></label>
                          <input type="text" class="form-control" id="reportTitle" placeholder="Nhập tiêu đề báo cáo" name="title" [(ngModel)]="title">
                      </div>
                      <div class="mb-3">
                          <label for="reportDescription" class="form-label">Mô tả <span class="text-danger">*</span></label>
                          <textarea class="form-control" id="reportDescription" rows="4" placeholder="Nhập mô tả chi tiết về báo cáo" name="description" [(ngModel)]="description"></textarea>
                      </div>
                       <div class="mb-3">
                          <label for="reportDueDate" class="form-label">Hạn nộp bài</label>
                          <input type="datetime-local" class="form-control" id="reportDueDate" name="due_date" [(ngModel)]="due_date" required>
                        </div>
                  </form>
              </div>
          </div>
      </div>
      <div class="col-lg-4 mb-4">
          <div class="card">
              <div class="card-header">
                  <i class="bi bi-gear me-2"></i> Tùy chọn
              </div>
              <div class="card-body">
                  <div class="d-grid gap-2 mb-3">
                      <button type="button" id="saveReport" class="btn btn-primary" (click)="createReport()">
                          <i class="bi bi-save me-2"></i>Lưu báo cáo
                      </button> 
                  </div>
              </div>
          </div>
      </div>
  </div>

  <!-- Student Selection -->
  <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="bi bi-people me-2"></i> Chọn sinh viên</span>
          <div class="d-flex">
              <input type="text" class="form-control form-control-sm me-2" id="studentSearch" placeholder="Tìm kiếm sinh viên..." style="width: 250px;"
              [(ngModel)]="searchTerm" (input)="search()">
          </div>
      </div>
      <div class="card-body">
          <div class="row g-3" id="studentList">
              <!-- Student Card 1 -->
              <div *ngFor="let student of studentList"  class="col-md-6 col-lg-4">
                  <div class="card student-card">
                      <div class="card-body d-flex align-items-center p-3">
                          <div class="student-avatar">
                              <span>NV</span>
                          </div>
                          <div class="student-info flex-grow-1">
                              <h5>{{student.student_name}}</h5>
                              <p>MSSV: {{student.student_code}}</p>
                              <span class="badge bg-success">{{student.class_student}}</span>
                          </div>
                          <div class="ms-2">
                            <div class="ms-2">
                                <input type="checkbox" class="custom-checkbox" [checked]="isSelected(student)" (change)="toggleSelection(student)"/>
                            </div>
                      </div>
                  </div>
              </div>              
          </div>
          <div class="d-flex justify-content-between align-items-center mt-3">
              <div>
                  <span class="text-muted">
                    Đã chọn: <span class="fw-bold">{{ selectedStudents.length }}</span> sinh viên
                    </span>
              </div>
              <nav aria-label="Page navigation">
                  <ul class="pagination pagination-sm mb-0">
                      <li class="page-item disabled">
                          <a class="page-link" href="#" aria-label="Previous">
                              <span aria-hidden="true">&laquo;</span>
                          </a>
                      </li>
                      <li class="page-item active"><a class="page-link" href="#">1</a></li>
                      <li class="page-item"><a class="page-link" href="#">2</a></li>
                      <li class="page-item"><a class="page-link" href="#">3</a></li>
                      <li class="page-item">
                          <a class="page-link" href="#" aria-label="Next">
                              <span aria-hidden="true">&raquo;</span>
                          </a>
                      </li>
                  </ul>
              </nav>
          </div>
      </div>
  </div>
