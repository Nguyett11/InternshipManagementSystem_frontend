<!-- Reports Management Section -->
<div class="section-header animate-fade-in">
    <i class="bi bi-file-earmark-text-fill"></i> QUẢN LÝ BÁO CÁO HỌC TẬP
</div>
<div class="content-card animate-fade-in">
    <!-- Search Box -->
    <div class="search-container">
        <div class="search-box">
            <i class="bi bi-search search-icon"></i>
            <input type="text" class="search-input" id="companySearchInput" placeholder="Tìm kiếm báo cáo theo tên..."
          [(ngModel)]="searchTerm" (input)="search()" >
        </div>
    </div>
    
    <div class="table-responsive">
        <table class="table table-hover align-middle" id="reportsTable">
            <thead>
                <tr>
                    <th scope="col" style="width: 20%;">Tiêu đề</th>
                    <th scope="col" style="width: 15%;">Mô tả</th>
                    <th scope="col" style="width: 10%;">Hạn nộp</th>
                    <th scope="col" style="width: 20%;" class="text-center">Quản lý</th>
                </tr>
            </thead>
            <tbody>
                <!-- Report 1 - Đã nộp, đã chấm điểm -->
                <tr *ngFor="let report of reports" >
                    <td>
                        <div class="d-flex align-items-center">
                            <span class="report-icon"><i class="bi bi-file-earmark-text"></i></span>
                            <div class="report-title">{{report.title}}</div>
                        </div>
                    </td>
                    <td>
                        <div class="report-description">{{report.description}}</div>
                    </td>
                    <td>
                        <div class="report-deadline">{{report.due_date | date: 'dd/MM/yyyy' }}</div>
                    </td>
                    <td class="text-center">
                        <div class="action-buttons justify-content-center">
                        
                           <button class="btn btn-action" title="Chỉnh sửa" (click)="editReport(report.report_id)">
                                <i class="bi bi-pencil"></i>
                            </button>

                            <button class="btn btn-action" title="Xem báo cáo" (click)="onClick(report.report_id)">
                                <i class="bi bi-chat-dots"></i>
                            </button>

                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="table-footer">
        <div class="pagination-info">
            Hiển thị 1-6 của 12 báo cáo
        </div>
        <div class="pagination-container">
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item disabled">
                        <a class="page-link" href="#" aria-label="Previous">
                            <span aria-hidden="true"><i class="bi bi-chevron-left"></i></span>
                        </a>
                    </li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item">
                        <a class="page-link" href="#" aria-label="Next">
                            <span aria-hidden="true"><i class="bi bi-chevron-right"></i></span>
                        </a>
                    </li>
                </ul>
            </nav>
            <button class="btn btn-view-all btn-primary ms-2">
                Xem tất cả <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </div>
    </div>

            <div *ngIf="isPersonalFormVisible"  class="update-form-container" id="personal-form">
                  <div class="update-form-header">
                      <h3 class="update-form-title">
                          <i class="bi bi-person-lines-fill"></i> Cập nhật thông tin báo cáo
                      </h3>
                      <button type="button" class="update-form-close" (click)="hideUpdateForm('personal-form')">
                          <i class="bi bi-x-lg"></i>
                      </button>
                  </div>
                  <form [formGroup]="reportForm">
                    <div class="row g-4">
                      <div class="col-md-6">
                        <div class="form-group">
                          <label for="title" class="form-label required-field">Tiêu đề</label>
                          <input type="text" class="form-control" id="title" formControlName="title" placeholder="Nhập họ và tên" required>
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="form-group">
                          <label for="description" class="form-label">Mô tả</label>
                          <input type="text" class="form-control" id="description" formControlName="description">
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="form-group">
                          <label for="due_date" class="form-label">Hạn nộp</label>
                          <input type="date" class="form-control" id="due_date" formControlName="due_date">
                        </div>
                      </div>
                    </div>

                    <div class="update-form-footer">
                        <div>
                            <button type="button" class="btn btn-outline" onclick="resetPersonalForm()">
                                <i class="bi bi-arrow-counterclockwise"></i> Khôi phục mặc định
                            </button>
                            <button type="button" class="btn btn-outline-info" onclick="loadProfileData('personal')">
                                <i class="bi bi-cloud-download"></i> Cập nhật từ hồ sơ
                            </button>
                        </div>
                        <div>
                            <button type="button" class="btn btn-secondary me-2" (click)="hideUpdateForm('personal-form')">
                                <i class="bi bi-x-circle"></i> Hủy
                            </button>
                            <button type="button" class="btn btn-primary" (click)="submitReport()">
                                <i class="bi bi-check-circle"></i> Lưu thay đổi
                            </button>
                        </div>
                    </div>
                  </form>  
        </div>
</div>
